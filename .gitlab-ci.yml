# The folders below will be cached between builds
# http://docs.gitlab.com/ce/ci/yaml/README.html#cache
workflow:
  rules:
    # Disable CI on the-navigator upstream (runs on stuurman only).
    # To enable CI on a fork retaining "navigator" in its name, set CI variable ENABLE_CI="true".
    - if: '$ENABLE_CI != "true" && ($CI_PROJECT_NAME =~ /navigator/i || $CI_PROJECT_PATH =~ /navigator/i)'
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == 'main'

variables:
  FF_USE_FASTZIP: "true"
  CACHE_COMPRESSION_LEVEL: "fastest"
  ARTIFACT_COMPRESSION_LEVEL: "fastest"
  CI_BUILD_IMAGE: "$CI_REGISTRY_IMAGE/ci:v1.64.1-slim"

stages:
  - ci-image
  - infrastructure
  - build
  - deploytos3

# ------------------------------------------------------------------------------
# Slim Custom Build Container (node:22-bookworm-slim + chromium-headless-shell + node_modules)
# Rebuilds automatically when Dockerfile.ci or package-lock.json changes, or manually.
# ------------------------------------------------------------------------------
ci:image:
  stage: ci-image
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  variables:
    GIT_DEPTH: "1"
  script:
    - mkdir -p /kaniko/.docker
    - printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY" "$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')" > /kaniko/.docker/config.json
    - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile "$CI_PROJECT_DIR/Dockerfile.ci" --destination "$CI_BUILD_IMAGE" --cache=true --compressed-caching=false
  rules:
    - if: $CI_COMMIT_BRANCH == 'main'
      changes:
        - Dockerfile.ci
        - package-lock.json
      when: on_success
    - if: $CI_COMMIT_BRANCH == 'main' && $REBUILD_CI_IMAGE == "true"
      when: on_success

# ------------------------------------------------------------------------------
# Infrastructure (Terraform S3 + MRAP + CloudFront + Route 53 + ACM)
# ------------------------------------------------------------------------------
.terraform_base:
  image:
    name: hashicorp/terraform:1.14
    entrypoint: [""]
  stage: infrastructure
  before_script:
    - |
      if [ -z "${TF_VAR_environment_domain:-}" ]; then
        echo "Error: TF_VAR_environment_domain is not set in GitLab CI/CD Variables." >&2
        exit 1
      fi
      export DOMAIN_SLUG="${TF_VAR_environment_domain_slug:-$(echo "$TF_VAR_environment_domain" | tr '.' '-')}"
      export STATE_BUCKET="${TF_STATE_BUCKET:-${DOMAIN_SLUG}-tfstate}"
      export STATE_REGION="${TF_STATE_REGION:-${AWS_DEFAULT_REGION:-ap-northeast-1}}"

# Step 1 (Greenfield only): One-time manual job to provision the dedicated S3 state bucket
terraform:bootstrap:
  extends: .terraform_base
  script:
    - terraform -chdir=terraform/bootstrap init -input=false
    - terraform -chdir=terraform/bootstrap apply -input=false -auto-approve -var="state_bucket_name=${STATE_BUCKET}" -var="state_bucket_region=${STATE_REGION}"
  rules:
    - if: $CI_COMMIT_BRANCH == 'main'
      when: manual
      allow_failure: true

# Step 2: Runs automatically when files in terraform/ change (or manually on any commit)
terraform:plan:
  extends: .terraform_base
  script:
    - terraform -chdir=terraform init -input=false -backend-config="bucket=${STATE_BUCKET}" -backend-config="region=${STATE_REGION}"
    - terraform -chdir=terraform validate
    - terraform -chdir=terraform plan -input=false -out=tfplan
  artifacts:
    name: tfplan
    paths:
      - terraform/tfplan
      - terraform/.terraform/
      - terraform/.terraform.lock.hcl
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == 'main' && $TF_VAR_environment_domain
      changes:
        - terraform/**/*
      when: on_success
    - if: $CI_COMMIT_BRANCH == 'main'
      when: manual
      allow_failure: true

# Step 3: Manual approval gate to apply the planned Terraform changes
terraform:apply:
  extends: .terraform_base
  needs:
    - job: terraform:plan
      artifacts: true
  script:
    - terraform -chdir=terraform apply -input=false -auto-approve tfplan
    - echo "==> Infrastructure provisioned successfully:"
    - terraform -chdir=terraform output
  rules:
    - if: $CI_COMMIT_BRANCH == 'main'
      when: manual
      allow_failure: true

# ------------------------------------------------------------------------------
# Static Site Build & S3/CloudFront Deployment
# Automatically runs in Starter Template Dry-Run Mode until S3_BUCKET is configured
# ------------------------------------------------------------------------------
build:
  image: $CI_BUILD_IMAGE
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == 'main'
      when: on_success
  needs:
    - job: ci:image
      optional: true
  variables:
    GIT_DEPTH: "0"
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .cache/
  script:
    - mkdir -p dist
    - |
      if [ -z "${S3_BUCKET:-}" ]; then
        echo "==> [DRY-RUN] S3_BUCKET is not set in GitLab CI/CD Variables."
        echo "==> Skipping Chromium install & Astro build on starter template repository."
        test -f package.json && test -f astro.config.mjs && test -f src/site.config.ts && test -f src/theme.config.ts
        echo "dry-run" > dist/.dry-run
        exit 0
      fi
      if [ "${CLEAN_BUILD:-0}" = "1" ]; then
        echo "CLEAN_BUILD=1 -> purging .cache/astro"
        rm -rf .cache/astro
      fi
      if [ -d /opt/ci-deps/node_modules ] && cmp -s package-lock.json /opt/ci-deps/package-lock.json; then
        echo "==> Linking pre-baked /opt/ci-deps/node_modules (0ms npm ci)"
        rm -rf node_modules
        ln -s /opt/ci-deps/node_modules ./node_modules
      else
        echo "==> Fallback: installing dependencies via npm ci..."
        npm ci --no-audit --no-fund
      fi
      node -e "const v = require('./package.json').devDependencies.playwright.replace(/^\D+/, ''); const img = process.env.CI_JOB_IMAGE || 'v1.64.1'; if (!img.includes('v' + v)) { console.error('Playwright version mismatch -> package.json=' + v + ' vs image=' + img); process.exit(1); }"
      npm run check
      npm run build
  artifacts:
    paths:
      - ./dist/

deploytos3:
  image: registry.gitlab.com/gitlab-org/cloud-deploy/aws-base:latest
  stage: deploytos3
  rules:
    - if: $CI_COMMIT_BRANCH == 'main'
      when: on_success
  variables:
    GIT_DEPTH: "1"
  needs:
    - job: build
      artifacts: true
  script:
    - |
      if [ -z "${S3_BUCKET:-}" ]; then
        echo "==> [DRY-RUN] S3_BUCKET is not set in GitLab CI/CD Variables."
        echo "==> Validating ./scripts/s3-deploy.sh syntax and passing dry-run..."
        bash -n ./scripts/s3-deploy.sh
        exit 0
      fi
      bash ./scripts/s3-deploy.sh ./dist
